    - data:
        code: "from datetime import datetime, timezone, timedelta\n\ndef main(\n \
          \   old_license_plate: str = \"-1\",\n    old_entry_time: str = \"-1\",\n\
          \    old_purpose: str = \"-1\",\n    old_company: str = \"-1\",\n    old_phone_number:\
          \ str = \"-1\",\n    new_license_plate: str = \"-1\",\n    new_purpose:\
          \ str = \"-1\",\n    new_company: str = \"-1\",\n    new_phone_number: str\
          \ = \"-1\",\n) -> dict:\n\n    def is_empty(value):\n        if value is\
          \ None:\n            return True\n        text = str(value).strip()\n  \
          \      return text == \"\" or text == \"-1\" or text.lower() in [\n    \
          \        \"null\",\n            \"none\",\n            \"undefined\",\n\
          \            \"未填写\",\n            \"无\",\n            \"空\",\n        ]\n\
          \n    def merge(old, new):\n        return old if is_empty(new) else new\n\
          \n    now_cn = datetime.now(timezone(timedelta(hours=8)))\n    current_time\
          \ = now_cn.strftime(\"%Y%m%d%H%M%S\")\n\n    data = {\n        \"license_plate\"\
          : merge(old_license_plate, new_license_plate),\n        \"entry_time\":\
          \ old_entry_time if not is_empty(old_entry_time) else current_time,\n  \
          \      \"purpose\": merge(old_purpose, new_purpose),\n        \"company\"\
          : merge(old_company, new_company),\n        \"phone_number\": merge(old_phone_number,\
          \ new_phone_number),\n    }\n\n    field_names = {\n        \"license_plate\"\
          : \"车牌号\",\n        \"purpose\": \"到访事由\",\n        \"company\": \"单位/公司\"\
          ,\n        \"phone_number\": \"手机号\",\n    }\n\n    missing = []\n    for\
          \ key, label in field_names.items():\n        if is_empty(data.get(key)):\n\
          \            missing.append(label)\n\n    question_priority = [\n      \
          \  (\"license_plate\", \"车牌号\"),\n        (\"company\", \"单位/公司\"),\n  \
          \      (\"purpose\", \"到访事由\"),\n        (\"phone_number\", \"手机号\"),\n\
          \    ]\n\n    question_fields = []\n    for key, label in question_priority:\n\
          \        if is_empty(data.get(key)):\n            question_fields.append(label)\n\
          \n    question_fields = question_fields[:2]\n\n    return {\n        **data,\n\
          \        \"missing_fields\": \"、\".join(missing),\n        \"missing_count\"\
          : len(missing),\n        \"question_fields\": \"、\".join(question_fields),\n\
          \    }"
